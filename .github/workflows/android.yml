name: Android APK
on:
  pull_request:
    paths:
      [
        "src/**",
        "public/**",
        "android/**",
        "scripts/**",
        "package*.json",
        "*config*",
        "index.html",
        ".github/workflows/android.yml",
      ]
  workflow_dispatch:
    inputs:
      require_stable_signing:
        description: Require the existing repository signing secret for an installable test release
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '16111833'
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run android:sync
      - name: Optional stable debug signer (never committed)
        env:
          ANDROID_TEST_KEYSTORE_BASE64: ${{ secrets.ANDROID_TEST_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_TEST_KEYSTORE_BASE64" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ANDROID_TEST_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo 'GM_SIGNING_MODE=repository-secret' >> "$GITHUB_ENV"
          else
            if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.require_stable_signing }}" = true ]; then
              echo 'Stable signing secret ANDROID_TEST_KEYSTORE_BASE64 is required for this release.' >&2
              exit 1
            fi
            echo 'GM_SIGNING_MODE=ephemeral-debug' >> "$GITHUB_ENV"
            echo '::warning::Ephemeral CI signer: this APK cannot be assumed to update a previous installation.'
          fi
      - name: Build B, native tests and external camera fixture
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:testDebugUnitTest :camera-fixture:assembleDebug --no-daemon
      - name: Preserve B and test runner
        run: |
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/GardenManager-Android-debug.apk
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk artifacts/GardenManager-test.apk
          cp android/camera-fixture/build/outputs/apk/debug/camera-fixture-debug.apk artifacts/Camera-fixture-test-only.apk
      - name: Checkout the actual GM-009 baseline for upgrade A
        uses: actions/checkout@v4
        with:
          ref: 567e633f95077c07b82188687bfbd09509d15ad0
          path: baseline
      - name: Build previous source A with the same signing key
        working-directory: baseline
        run: |
          npm ci
          npm run android:sync
          cd android
          ./gradlew :app:assembleDebug -PgmVersionCode=2 -PgmVersionName=0.4.0-test.2 --no-daemon
      - name: Preserve baseline A
        run: cp baseline/android/app/build/outputs/apk/debug/app-debug.apk artifacts/GardenManager-A.apk
      - name: Verify standalone package
        run: |
          python3 scripts/check-android-package.py artifacts/GardenManager-Android-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs artifacts/GardenManager-Android-debug.apk
          python3 scripts/android-artifact-metadata.py
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GardenManager-Android-debug
          path: |
            artifacts/GardenManager-Android-debug.apk
            artifacts/APK-METADATA.json
            artifacts/SHA256SUMS.txt
          retention-days: 30
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Android offline and update A to B
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -writable-system -camera-back none
          script: |
            scripts/android-device-check.sh artifacts/GardenManager-A.apk artifacts/GardenManager-Android-debug.apk artifacts/GardenManager-test.apk
            scripts/android-install-camera-fixture.sh artifacts/Camera-fixture-test-only.apk
            adb shell am instrument -w -r -e class pl.broniarek.gardenmanager.CameraFlowSetupTest pl.broniarek.gardenmanager.test/androidx.test.runner.AndroidJUnitRunner | tee artifacts/android-camera-setup.txt
            grep -q 'OK (1 test)' artifacts/android-camera-setup.txt
            node scripts/android-camera-check.mjs
      - name: Collect device log
        if: always()
        run: |
          mkdir -p artifacts
          if [ ! -s artifacts/android-logcat.txt ]; then timeout 15s adb logcat -d > artifacts/android-logcat.txt || true; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-test-reports
          path: |
            android/app/build/reports/tests/
            artifacts/android-*
