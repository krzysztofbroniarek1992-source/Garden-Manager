name: Windows EXE
on:
  pull_request:
    paths: ['src/**','public/**','desktop/**','desktop-tests/**','scripts/**','package*.json','*config*','index.html','.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: TypeScript, desktop policy and unit regression
        run: |
          npx tsc -b
          npm run test:desktop:unit
          npm test
      - name: Build the installed local assets
        run: npm run build:windows
      - name: Real Electron windows, native IPC, files and offline
        run: npm run test:desktop
      - name: Build installer A
        shell: pwsh
        run: |
          $env:GM_WINDOWS_VERSION = '0.5.0-test.1'
          $env:GM_WINDOWS_BUILD_VERSION = '0.5.0.1'
          $env:GM_WINDOWS_OUTPUT = 'release-windows-a'
          npx electron-builder --win nsis --x64 --config desktop/electron-builder.cjs --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build installer B and verify actual package
        shell: pwsh
        run: |
          npx electron-builder --win nsis --x64 --config desktop/electron-builder.cjs --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/check-windows-package.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Real NSIS update with persistent profile
        shell: pwsh
        run: scripts/test-windows-upgrade.ps1
      - name: Publish unsigned test installer
        uses: actions/upload-artifact@v4
        with:
          name: GardenManager-Windows-test
          path: |
            release-windows/*.exe
            release-windows/WINDOWS-METADATA.json
            release-windows/SHA256SUMS.txt
          retention-days: 30
      - name: Desktop diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-test-reports
          path: |
            test-results-desktop/
            release-windows/builder-debug.yml
          if-no-files-found: ignore
