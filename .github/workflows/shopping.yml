name: Shopping regression
on:
  push:
    branches: [codex/gm010a-shopping-list]
  pull_request:
    paths: ['src/**', 'tests/**', 'pwa-tests/**', 'android-web-tests/**', 'desktop-tests/**', 'package*.json', '*config*', 'index.html', '.github/workflows/shopping.yml']
permissions:
  contents: read
concurrency:
  group: shopping-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx tsc -b
      - run: npm test
      - run: npm run test:desktop:unit
      - run: git diff --check
  browser:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:pwa
      - run: npm run test:android-web
      - run: npm run build
      - name: Failure context
        if: failure()
        run: |
          find test-results test-results-pwa test-results-android -name error-context.md -print -exec cat {} \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Shopping-browser-reports
          path: |
            test-results/
            test-results-pwa/
            test-results-android/
          if-no-files-found: ignore
